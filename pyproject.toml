[project]
name = "wfigs-mcp"
version = "0.1.0"
description = "MCP server for NIFC WFIGS wildfire perimeter data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.20.0,<2",
    "numpy>=1.26.0,<2.4",
    "pydantic>=2.12.0,<3",
    "pyproj>=3.7.0,<4",
    "shapely>=2.1.0,<2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2",
    "pytest>=8.4.0,<10",
    "pytest-asyncio>=1.2.0,<2",
    "respx>=0.22.0,<1",
    "ruff>=0.14.0,<1",
    "types-shapely>=2.1.0,<3",
]

[project.scripts]
wfigs-mcp = "wfigs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfigs_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["live: opt-in tests against public NIFC services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wfigs_mcp"]
mypy_path = "src"
